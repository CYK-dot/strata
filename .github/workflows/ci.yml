#
# Runs the self-contained test suite: engine, contract, DAG baseline and the
# CMake integration cases (configure-only, no compiler needed). The demo tree
# lives outside this repository; its end-to-end acceptance runs in the
# workspace, not here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the test runner
        run: python -m pip install pytest
      - name: Run the test suite
        run: python -m pytest -q
